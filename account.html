<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width", initial-scale="1">
    <title>Mid Valley Auto Transport Inc.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<!-- TODO: Add css style and design for the account page based on the website mockup-->
<body class="account">
    <div class="page">
        <header class="site-header dark">
            <nav class="nav" aria-label="Main">
                <a class="nav-logo" href="index.html">
                    <img src="assets/nav-logo-white.png" width="340" height="125" alt="Mid Valley Auto Transport Inc. - Home">
                </a>
                <ul class="nav-links">
                    <li><a href="about-us.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="getquote.html">Get A Quote</a></li>
                    <li><a href="termsandconditions.html">Terms &amp; Conditions</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
                <a class="nav-cta" href="contact.html">CONTACT</a>
            </nav>
        </header>
        <main class="photo-main">
            <form class="account-box" action="#" method="post">
                <h1>CREATE YOUR ACCOUNT</h1>
                
                <div class="fields">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>

                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" required>

                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn-black create-btn">CREATE</button>

                <p class="auth-alt">Already have an account?</p>

                <a class="btn-black login-link" href="login.html">LOGIN</a>
            </form>
        </main>
    </div>
</body>
</html>
