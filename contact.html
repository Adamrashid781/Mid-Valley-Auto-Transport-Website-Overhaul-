<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Mid Valley Auto Transport Inc. | Get In Touch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="contact">
    <div class="page">
        <header class="site-header dark">
            <nav class="nav" aria-label="Main">
                <a class="nav-logo" href="index.html">
                    <img src="assets/nav-logo-white.png" width="340" height="125" alt="Mid Valley Auto Transport Inc. - Home">
                </a>
                <ul class="nav-links">
                    <li><a href="about-us.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="getquote.html">Get A Quote</a></li>
                    <li><a href="termsandconditions.html">Terms &amp; Conditions</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
                <a class="nav-cta" href="contact.html" aria-current="page">CONTACT</a>
            </nav>
        </header>
        <main>
            <h1>Get in Touch</h1>
            <p class="introduction">Reach out, share a question or provide feedback. Fill out the form and we'll respond as soon as possible.</p>

            <form class="contact-form" action="#" method="post">
                <div class="row">
                    <div class="field">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>
                    </div>

                    <div class="field">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                </div>

                <div class="field medium">
                    <label for="organization">Organization</label>
                    <input class="text" id="organization" name="organization" autocomplete="organization">
                </div>

                <div class="field medium">
                    <label for="inquiry-type">Type of Inquiry</label>
                    <input class="text" id="inquiry-type" name="inquiry-type" required>
                </div>               

                 <div class="field wide">
                    <label for="message">Message</label><br>
                    <textarea id="message" name="message" rows="1"></textarea>
                 </div>

                <button type="submit">Send Message</button>
            </form>
        </main>
    </div>
</body>
</html>
