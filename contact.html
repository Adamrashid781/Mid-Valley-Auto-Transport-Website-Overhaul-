<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Mid Valley Auto Transport Inc. | Get In Touch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500&display=swap">
    <link rel="stylesheet" href="css/styles.css">
    <!--TODO: Update the style and format to fully match desired design of webpage -->
    <style>
        h1 { font-family: "Inter", Arial, sans-serif; font-weight: 400; font-size: 52px; line-height: 1; margin: 36px 0 6px; }
        .introduction { font-family: "Inter", Arial, sans-serif; font-size: 12px; text-transform: uppercase; max-width: 320px; line-height: 1.2; margin: 0; }
        form { font-family: "Inter", Arial, sans-serif; margin: 50px 0 0 50px; }
        label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 2px; }
        input, textarea { display: block; background: #d9d9d9; border: none; padding: 6px; margin: 0; font-family: inherit; font-size: 12px; box-sizing: border-box; }
        .row { display: flex; gap:4px; margin-bottom: 8px; }
        .row input { width: 150px; }
        .medium { width: 300px; }
        .wide { width: 440px; }
        form p { margin: 0 0 4px; }
        button { background: #000; color: #fff; border: none; border-radius:999px; padding: 6px 12px; font-size: 12px; margin-top: 4px; cursor: pointer; }
    </style>
</head>
<body class="contact">
    <div class="page">
        <header class="site-header light">
            <nav class="nav" aria-label="Main">
                <a class="nav-logo" href="index.html">
                    <img src="assets/nav-logo-color.png" width="340" height="125" alt="Mid Valley Auto Transport Inc. - Home">
                </a>
                <ul class="nav-links">
                    <li><a href="about-us.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="getquote.html">Get A Quote</a></li>
                    <li><a href="termsandconditions.html">Terms &amp; Conditions</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
                <a class="nav-cta" href="contact.html">CONTACT</a>
            </nav>
        </header>
        <main>
            <h1>Get in Touch</h1>
            <p class="introduction">Reach out, share a question or provide feedback. Fill out the form and we'll respond as soon as possible.</p>
            <form action="#" method="post">
                <div class="row">
                    <div>
                        <label for="first-name">First Name</label><br>
                        <input type="text" id="first-name" name="first-name" required>
                    </div>

                    <div>
                        <label for="last-name">Last Name</label><br>
                        <input type="text" id="last-name" name="last-name" required>
                    </div>

                    <div>
                        <label for="email">Email</label><br>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>

                <p>
                    <label for="organization">Organization</label><br>
                    <input class="medium" id="organization" name="organization">
                </p>

                <p>
                    <label for="inquiry-type">Type of Inquiry</label><br>
                    <input class="medium" id="inquiry-type" name="inquiry-type" required>
                </p>               

                 <p>
                    <label for="message">Message</label><br>
                    <textarea class="wide" id="message" name="message" rows="2"></textarea>
                </p>

                <button type="submit">Send Message</button>
            </form>
        </main>
    </div>
</body>
</html>
