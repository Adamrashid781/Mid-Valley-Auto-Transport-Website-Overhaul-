<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | Mid Valley Auto Transport Inc.</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth login">
    <div class="page">

        <header class="site-header light">
            <nav class="nav" aria-label="Main">
                <a class="nav-logo" href="index.html">
                    <img src="assets/nav-logo-color.png"
                         width="433" height="158"
                         alt="Mid Valley Auto Transport Inc. - Home">
                </a>

                <ul class="nav-links">
                    <li><a href="about-us.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="getquote.html">Get A Quote</a></li>
                    <li><a href="termsandconditions.html">Terms &amp; Conditions</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>

                <a class="nav-cta" href="contact.html">CONTACT</a>
            </nav>
        </header>

        <main class="photo-main">

            <form class="auth-card login-card" action="" method="post">
                <h1>LOGIN</h1>

                <label for="login-email">Email Address</label>
                <input
                    id="login-email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                >

                <label for="login-password">Password</label>
                <input
                    id="login-password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <div class="auth-actions">
                    <a class="btn-grey" href="reset_password_email.html">
                        Forgot Password
                    </a>

                    <button type="submit" class="btn-black">
                        LOGIN
                    </button>
                </div>

                <p class="auth-alt">
                    New here?
                    <a href="account.html">Create an account</a>
                </p>
            </form>

        </main>
    </div>
</body>
</html>
